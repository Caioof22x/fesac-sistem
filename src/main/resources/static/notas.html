<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Notas | FESAC</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span>F</span>
                <div><strong>FESAC</strong><small>Sistema de Gestão</small></div>
            </div>
            <nav><a href="index.html">⌂ Início</a><a href="salas.html">▣ Salas</a><a href="criterios.html">✓
                    Critérios</a><a class="active" href="notas.html">✎ Notas</a><a href="ranking.html">🏆 Ranking</a></nav>
            <div class="user-box">
                <div class="avatar">P</div>
                <div><strong>Professor</strong><small>Usuário autenticado</small></div>
            </div>
        </aside>
        <main>
            <header>
                <div>
                    <h1>Lançamento de Notas</h1>
                    <p>Registre a pontuação da sala em cada critério.</p>
                </div>
            </header>
            <section class="panel">
                <div class="form-grid">
                    <div><label for="sala">Selecionar sala</label><select id="sala"></select></div>
                </div>
            </section>
            <section class="panel">
                <h2>Notas da sala</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Critério</th>
                            <th>Máximo</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody id="lista"></tbody>
                </table>
                <p id="mensagem" role="alert"></p>
                <div class="actions"><button class="btn primary" id="salvar" type="button">Salvar notas</button></div>
            </section>
            <footer>Sistema FESAC • Colégio Antônio Carlos</footer>
        </main>
    </div>
<script src="js/comum.js"></script>
<script src="js/notas.js"></script>
</body>

</html>
